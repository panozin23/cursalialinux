<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16233f"/>
      <stop offset="1" stop-color="#0a1730"/>
    </linearGradient>
    <linearGradient id="hielo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <!-- tile de fondo -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#tile)"/>
  <rect x="8" y="8" width="240" height="240" rx="52" fill="none" stroke="#1e3a5f" stroke-width="2"/>
  <!-- anillo "C" abierto a la derecha -->
  <path d="M 178 82
           A 62 62 0 1 0 178 174"
        fill="none" stroke="url(#hielo)" stroke-width="24" stroke-linecap="round"/>
  <!-- cursor de terminal: chevron + guion (acento hielo) -->
  <path d="M 150 104 L 172 128 L 150 152" fill="none" stroke="#a5f3fc"
        stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="150" y1="168" x2="186" y2="168" stroke="#a5f3fc" stroke-width="16" stroke-linecap="round"/>
</svg>
