# cursalialinux — preferir ntfs-3g sobre ntfs3
#
# ntfs3 (el controlador del núcleo) es más rápido, pero se NIEGA a montar
# discos NTFS que Windows no cerró correctamente: dan el error
# "wrong fs type, bad option, bad superblock", que no explica nada.
#
# Como cursalialinux la usa gente que viene de Windows y conecta discos
# externos y memorias a diario —muchos desconectados sin expulsar, o
# hibernados por el Inicio rápido de Windows— se prefiere ntfs-3g:
# algo más lento por USB, pero monta siempre.
#
# Comprobado el 2026-07-26 con un disco externo que ntfs3 rechazaba y
# ntfs-3g montó sin problema.

blacklist ntfs3
