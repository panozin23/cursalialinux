# grub.cfg del ISO — lado UEFI — cursalialinux Ligera (XFCE)
#
# RECONSTRUIDO el 2026-07-25. El original vivía solo en la carpeta de trabajo
# de la partición p6 y se perdió al formatearla; no estaba en el respaldo de
# SANSUNG2. Reconstruido a partir del menú isolinux (arranque BIOS) de
# scripts/build-real.sh, para que las dos formas de arrancar el ISO ofrezcan
# exactamente las mismas opciones y los mismos argumentos de kernel.
#
# SIN PROBAR TODAVÍA: validar con scripts/prueba-visual.sh (QEMU en modo UEFI)
# antes de dar por bueno un ISO nuevo.
#
# Lo copia build-real.sh en su paso 4 a  $W/boot/grub/grub.cfg
# El bootx64.efi del paso 5 llega aquí así:
#     search --set=root --file /.disk/cursalia
#     set prefix=($root)/boot/grub
#     configfile /boot/grub/grub.cfg

set default=0
set timeout=10
set timeout_style=menu

insmod all_video
insmod gfxterm
insmod png
insmod iso9660
insmod search_fs_file

# Localizar el propio ISO por su fichero marcador (lo crea el paso 1 del script).
search --no-floppy --set=root --file /.disk/cursalia

# Marca Azul Hielo. Si no hay fuente gráfica disponible se cae a modo texto
# sin romper el arranque: por eso todo va dentro del "if".
if loadfont unicode ; then
  # Modos concretos y a 32 bits antes de "auto". Con gfxmode=auto la prueba en
  # QEMU (2026-07-25) salía con rayas de colores horizontales: GRUB elegía un
  # modo cuyo formato de píxel no cuadraba. Se dejan varios por si el equipo
  # no admite el primero; "auto" queda de último recurso.
  set gfxmode=1024x768x32,800x600x32,1024x768,800x600,auto
  terminal_output gfxterm
  if background_image /isolinux/boot-bg.png ; then true ; fi
fi
set color_normal=light-cyan/black
set menu_color_normal=light-cyan/black
set menu_color_highlight=black/cyan

menuentry "Probar / Instalar cursalialinux" {
    linux /live/vmlinuz boot=live components locales=es_MX.UTF-8 keyboard-layouts=latam quiet splash
    initrd /live/initrd.img
}

menuentry "cursalialinux (graficos seguros)" {
    linux /live/vmlinuz boot=live components locales=es_MX.UTF-8 keyboard-layouts=latam quiet splash nomodeset
    initrd /live/initrd.img
}
